[package]
name = "file-deduplicator"
version = "0.1.0"
edition = "2021"
description = "Find and safely remove duplicate files"
license = "MIT"
repository = "https://github.com/DIEMOS192/file-deduplicator"

[[bin]]
name = "dedup"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
